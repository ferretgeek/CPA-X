name: 功能建议 / Feature request
description: 提议一个明确、可复用的改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue 和 Discussions，未发现相同建议。
          required: true
        - label: 这个建议与 CPA-X 的监控、管理或部署范围相关。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述真实使用场景，而不只是期望的按钮或实现方式。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 说明理想行为、界面或配置方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 后端 / API
        - 前端 / UI
        - 安装与部署
        - Docker
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性说明
      description: 是否影响现有配置、CLIProxyAPI 版本或部署方式？
